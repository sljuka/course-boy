version: "3.7"

services:
  seeder:
    # Filled in by pin-image.sh from the released multi-arch image.
    image: ghcr.io/sljuka/matko-seeder:VERSION@sha256:DIGEST
    # The host's network, not Umbrel's bridge (SLJ-194): behind the bridge, a
    # teacher's app on the same home network couldn't be reached from the
    # seeder (checked on a real Umbrel). Host-network apps can't use Umbrel's
    # app proxy, so there's no app_proxy service and the page has a password
    # of its own: Umbrel's per-install APP_PASSWORD, which it shows the owner
    # (deterministicPassword in umbrel-app.yml).
    network_mode: host
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      MATKO_SEED_DATA: /data
      MATKO_SEED_WEB_PORT: 8380
      MATKO_SEED_WEB_HOST: 0.0.0.0
      MATKO_SEED_WEB_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/seeder:/data
