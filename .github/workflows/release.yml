# Checks every push to main, releases when it holds a `feat` or `fix`, and
# builds the desktop app on each OS for that release, attaching the
# installers to its *draft* GitHub Release. Publishing that release is a
# manual step on GitHub; nothing here publishes.
#
# Versions come from the commit messages (Conventional Commits, checked by
# commitlint): semantic-release (.releaserc.json) picks the next version, sets
# it in package.json, writes CHANGELOG.md, commits that as
# `chore(release): x.y.z`, tags `vx.y.z` and creates the draft release. Nobody
# sets versions or pushes tags by hand.
#
# Why one runner per OS and not cross-building from one machine: the Bare
# worker's runtime (`bare-runtime-<platform>-<arch>`) is an optional dependency
# that npm only installs for the machine it runs on. A package built anywhere
# else ships the wrong `bare` binary and peer-to-peer sharing fails to start.
#
# Builds are unsigned for now (SLJ-34): macOS Gatekeeper and Windows SmartScreen
# will warn on first launch.
#
# Branches: day-to-day work goes to `develop`; merging it into `main` is what
# releases (everything merged since the last release becomes one version).
#
# Triggers:
#   - push to main → check; for a `feat`/`fix`, release + build + attach
#   - push to develop, or a pull request → check only
#   - "Run workflow" on the Actions tab → check + build only; installers are
#     kept as workflow artifacts for a week

name: Release

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One release at a time: two pushes in a row must not pick the same version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The pushed commits' messages are checked below.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every commit this push added (a new branch has no `before`: only its
      # last commit), or a pull request's commits. The local commit-msg hook
      # can be skipped; this can't.
      - name: Commit messages
        if: github.event_name != 'workflow_dispatch'
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            npx commitlint --from "$PR_BASE" --to "$PR_HEAD" --verbose
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            npx commitlint --last --verbose
          else
            npx commitlint --from "$BEFORE" --to "$GITHUB_SHA" --verbose
          fi
      - run: npm run check

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Pushes the release commit and tag, and creates the draft release.
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The release commit is pushed with this workflow's token, which never
      # starts another workflow run, so it doesn't release again.
      - id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npx semantic-release
          tag="$(git tag --points-at HEAD --list 'v*')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then echo "Released $tag"; else echo "No release: nothing to release in this push"; fi

  build:
    needs: [check, release]
    # "Run workflow" (release skipped), or a push that released a version.
    if: >-
      always() && needs.check.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.release.outputs.tag != '')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            builder-args: --mac --arm64
          - name: macos-x64
            os: macos-15-intel
            builder-args: --mac --x64
          - name: windows-x64
            os: windows-latest
            builder-args: --win --x64
          - name: linux-x64
            # Pinned, not ubuntu-latest (Ubuntu 26 from 2026-10-19): the packaged-app
            # check's AppArmor/xvfb setup below is proven on 24.04, and building on
            # an older release keeps the app's minimum Linux requirements lower.
            os: ubuntu-24.04
            builder-args: --linux --x64
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.name }})
    steps:
      # The release's tag, so package.json carries its version (the installers'
      # names and the app's About come from it); else the pushed commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      # The rpm package (Fedora) is built with rpmbuild.
      - name: Install rpm tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      # macOS's malware scanner (XProtect) scans the DMG while electron-builder
      # has it mounted, and hdiutil then can't eject it ("Resource busy"),
      # failing the build now and then, mostly on the Intel runners. Stopping it
      # on this throwaway runner is the runner-images maintainers' workaround
      # (actions/runner-images#7522).
      - name: Stop XProtect (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo pkill -9 XProtect >/dev/null || true
          while pgrep XProtect; do sleep 3; done
      - name: Package (unsigned)
        run: npx electron-builder ${{ matrix.builder-args }} --publish never -c.mac.identity=null
        shell: bash

      # Launch the packaged app: bundled files present, asar off, Bare worker
      # starts. See scripts/check-packaged.mjs.
      - name: Check packaged app (macOS, Windows)
        if: runner.os != 'Linux'
        run: node scripts/check-packaged.mjs
      - name: Check packaged app (Linux)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's
          # sandbox needs; allow them on this throwaway runner only.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run --auto-servernum node scripts/check-packaged.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: matko-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: error
          path: |
            release/*/*.dmg
            release/*/*.exe
            release/*/*.AppImage
            release/*/*.deb
            release/*/*.rpm

  # The installers go on the draft release semantic-release created.
  attach-installers:
    needs: [release, build]
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach installers to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          find artifacts -type f -print0 \
            | xargs -0 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
